<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingreso funcionarios - CESFAM</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body class="auth-screen">
    <main class="auth-shell">
      <section class="auth-panel">
        <p class="section-label">CESFAM</p>
        <h1>Ingreso funcionarios</h1>
        <p class="auth-copy">Acceda con su cuenta Microsoft/Outlook para operar una ventanilla.</p>
        <a class="primary-action" href="/auth/login">Ingresar con Outlook</a>
        <a id="devLogin" class="secondary-action is-hidden" href="/auth/dev">Modo de prueba local</a>
        <p id="configNotice" class="notice is-hidden">Configure las credenciales Microsoft antes de usar el ingreso real.</p>
      </section>
    </main>

    <script src="/assets/login.js"></script>
  </body>
</html>
